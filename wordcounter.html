<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الكلمات | Word Counter</title>
<meta name="description" content="احسب عدد الكلمات والحروف في النص بسرعة وسهولة.">
<meta name="keywords" content="عداد الكلمات, Word Counter, عدد الحروف, حساب الكلمات">
<link rel="stylesheet" href="style.css">
<style>
textarea {
    width: 90%;
    height: 150px;
    margin: 15px 0;
    padding: 10px;
    font-size: 16px;
    border: 2px solid #ccc;
    border-radius: 8px;
    resize: none;
}
.result {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}
</style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">حاسبة العمر</a></li>
            <li><a href="BMI.html">حاسبة BMI</a></li>
            <li><a href="Password.html">مولد كلمات السر</a></li>
            <li><a href="wordcounter.html" class="active">عداد الكلمات</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>عداد الكلمات والحروف</h1>
        <h2>أدخل النص لمعرفة عدد الكلمات والحروف</h2>
        <textarea id="text" placeholder="أدخل النص هنا..."></textarea>
        <div class="result" id="result">الكلمات: 0 | الحروف: 0</div>
        <button onclick="countWords()">احسب</button>
    </div>

<script>
function countWords() {
    const text = document.getElementById("text").value.trim();
    const words = text.split(/\s+/).filter(word => word.length > 0);
    const letters = text.replace(/\s+/g, '').length;
    document.getElementById("result").innerText =
        `الكلمات: ${words.length} | الحروف: ${letters}`;
}
</script>
</body>
</html>
