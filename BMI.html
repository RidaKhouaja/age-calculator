<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة مؤشر كتلة الجسم | BMI Calculator</title>
<meta name="description" content="احسب مؤشر كتلة الجسم (BMI) بسهولة لمعرفة الوزن المثالي حسب طولك ووزنك.">
<meta name="keywords" content="حاسبة BMI, مؤشر كتلة الجسم, الوزن المثالي, BMI Calculator">
<style>
    body {
        font-family: 'Cairo', sans-serif;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 0;
    }
    .container {
        background: white;
        padding: 30px 20px;
        border-radius: 15px;
        width: 90%;
        max-width: 450px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(30px);}
        to {opacity: 1; transform: translateY(0);}
    }
    h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 10px;
    }
    h2 {
        font-size: 18px;
        color: #666;
        margin-bottom: 15px;
    }
    input {
        width: 85%;
        padding: 12px;
        margin: 10px 0;
        font-size: 16px;
        border: 2px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: 0.3s;
    }
    input:focus {
        border-color: #6a11cb;
        box-shadow: 0 0 8px rgba(106,17,203,0.3);
    }
    button {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: white;
        padding: 12px 25px;
        border: none;
        font-size: 18px;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.3s;
    }
    button:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(106,17,203,0.4);
    }
    .result {
        margin-top: 15px;
        font-size: 18px;
        font-weight: bold;
        color: #333;
    }
    a {
        display: block;
        margin-top: 20px;
        text-decoration: none;
        color: #6a11cb;
        font-weight: bold;
    }
</style>
</head>
<body>
    <nav>
    <ul>
        <li><a href="index.html">حاسبة العمر</a></li>
        <li><a href="BMI.html">حاسبة BMI</a></li>
        <li><a href="Password.html">مولد كلمات السر</a></li>
        <li><a href="wordcounter.html">عداد الكلمات</a></li>
    </ul>
</nav>

    <div class="container">
        <h1>حاسبة مؤشر كتلة الجسم (BMI)</h1>
        <h2>احسب وزنك المثالي بسهولة</h2>
        <input type="number" id="weight" placeholder="أدخل وزنك (كغ)">
        <input type="number" id="height" placeholder="أدخل طولك (سم)">
        <button onclick="calculateBMI()">احسب BMI</button>
        <div class="result" id="result"></div>
        <a href="index.html">🔙 العودة إلى حاسبة العمر</a>
    </div>

<script>
function calculateBMI() {
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value) / 100;
    if (!weight || !height) {
        document.getElementById('result').innerText = "الرجاء إدخال الوزن والطول.";
        return;
    }
    const bmi = (weight / (height * height)).toFixed(2);
    let category = "";
    if (bmi < 18.5) category = "نحافة";
    else if (bmi < 25) category = "وزن مثالي";
    else if (bmi < 30) category = "زيادة في الوزن";
    else category = "سمنة";

    document.getElementById('result').innerText = `BMI = ${bmi} (${category})`;
}
</script>
</body>
</html>
