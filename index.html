        <p>حاسبة العمر أداة مجانية لحساب العمر بدقة من تاريخ الميلاد. اعرف كم عمرك الآن بسهولة.</p>
        <input type="date" id="birthDate">
        <br>
        <button onclick="calculateAge()">احسب العمر</button>
        <div class="result" id="result"></div>
    </div>

<script>
function calculateAge() {
    const birthDate = document.getElementById("birthDate").value;
    if (!birthDate) {
        document.getElementById("result").innerText = "الرجاء إدخال تاريخ الميلاد.";
        return;
    }
    const today = new Date();
    const birth = new Date(birthDate);
    let ageYears = today.getFullYear() - birth.getFullYear();
    let ageMonths = today.getMonth() - birth.getMonth();
    let ageDays = today.getDate() - birth.getDate();

    if (ageDays < 0) {
        ageMonths--;
        ageDays += 30;
    }
    if (ageMonths < 0) {
        ageYears--;
        ageMonths += 12;
    }

    document.getElementById("result").innerText =
        `عمرك هو: ${ageYears} سنة، ${ageMonths} شهر، ${ageDays} يوم.`;
}
</script>
